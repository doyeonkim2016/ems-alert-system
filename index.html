<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMS Alert System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE a bright monitoring desk for a bottler's energy team: clear, quick to scan, nothing dark
   IDEA the plant's meter wall: register windows for the headline numbers, the 96-slot day as a lit panel
   PICTURE the network map with alert pins; on the meter page, 7 days of 15-minute readings against their baseline band
   COLOUR bottler red #f40009 bar and accents, white page; teal for energy readings, red for DQ alerts, amber diamonds for anomalies
   TYPE Barlow Condensed for titles and figures, Barlow for text
   LAYOUT red bar with three menus; white hero with register figures; content cards below; phones stack */
:root{color-scheme:light;--red:#f40009;--deep:#c4000a;--bg:#ffffff;--ink:#1f1f1f;--mute:#676665;--line:#ebe9e7;--soft:#f7f6f5;--tint:#fff1f1;--teal:#0f8f80;--teal2:#0b6b60;--amber:#f59e0b;--amberink:#9a5b00;--ambersoft:#fff6e0;--ok:#a9a7a5}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",Arial,sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.band{position:relative;z-index:5;background:var(--red);color:#fff;isolation:isolate;padding-bottom:40px}
.fx{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.bubbles i{position:absolute;bottom:-20px;border-radius:50%;border:1px solid rgb(255 255 255/.35);animation:fizz linear infinite}
.wave{position:absolute;left:0;bottom:-1px;width:200%;height:46px;animation:drift 70s linear infinite}
.wave.b{height:38px;opacity:.45;animation-duration:110s;animation-direction:reverse}
.wave path{fill:var(--bg)}
@keyframes fizz{to{transform:translateY(-60vh);opacity:0}}
@keyframes drift{to{transform:translateX(-50%)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.4);opacity:0}}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px max(4vw,16px) 0;max-width:1320px;margin:0 auto}
.brand{display:flex;gap:10px;align-items:center;font:800 28px/1 "Barlow Condensed",sans-serif}
.brand svg{width:30px;height:30px;flex:none}
.me{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.2}.me small{display:block;opacity:.9}
.av{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font:800 15px "Barlow Condensed",sans-serif}
nav{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:4px;padding:10px max(4vw,16px) 0;max-width:1320px;margin:0 auto}
.grp{position:relative}
.grp summary{list-style:none;cursor:pointer;color:rgb(255 255 255/.9);padding:8px 30px 10px 12px;font-weight:600;font-size:16px;border-bottom:3px solid transparent;position:relative}
.grp summary::-webkit-details-marker{display:none}
.grp summary::after{content:"";position:absolute;right:12px;top:14px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s}
.grp[open] summary::after{transform:translateY(3px) rotate(225deg)}
.grp.on summary,.grp summary:hover{color:#fff}.grp.on summary{border-bottom-color:#fff}
.menu{position:absolute;left:0;top:100%;min-width:240px;background:#fff;color:var(--ink);border-radius:14px;padding:8px;box-shadow:0 18px 40px rgb(80 0 0/.18);display:grid;gap:2px;animation:fade .15s ease-out}
.menu a{display:block;color:var(--ink);text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:600}
.menu a small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.menu a:hover{background:var(--soft)}.menu a[aria-current=page]{background:var(--tint);box-shadow:inset 3px 0 0 var(--red)}
#hero{max-width:1320px;margin:0 auto;padding:clamp(16px,2.2vw,28px) max(4vw,16px) 4px}
#hero h1{font-size:clamp(34px,4.4vw,54px);line-height:1;margin:0;font-weight:800;text-wrap:balance;max-width:24ch}
#hero .sub{margin:8px 0 0;color:var(--mute);font-size:16.5px;max-width:78ch}
#hero.enter>*{animation:rise .35s ease-out both}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));margin-top:18px;border-top:3px solid var(--red)}
.fig{padding:12px 16px 0 0}.fig+.fig{padding-left:16px;border-left:1px solid var(--line)}
.fig small{display:block;font-size:14px;color:var(--mute);margin-top:6px}
.reg{display:inline-flex;align-items:flex-end;gap:3px;background:#f1f0ef;border:1px solid #dddbd9;padding:5px 6px;border-radius:9px;box-shadow:inset 0 1px 3px rgb(0 0 0/.1);font:700 clamp(28px,3vw,40px)/1 "Barlow Condensed",sans-serif;color:#1a1a1a}
.reg .d{width:.66em;height:1.12em;overflow:hidden;border-radius:3px;background:linear-gradient(#ecebea,#fff 38%,#fff 62%,#ecebea);box-shadow:0 0 0 1px #e4e2e0;text-align:center}
.reg .d b{display:flex;flex-direction:column;transform:translateY(calc(var(--v,0)*-1.12em));transition:transform .8s cubic-bezier(.25,.8,.25,1)}
.reg .d b span{height:1.12em;line-height:1.12em}
.reg .d.z{color:#c9c7c5}
.reg .d.dec{background:linear-gradient(#ff4b52,var(--red) 38%,var(--red) 62%,#ff4b52);color:#fff;box-shadow:none}
.reg .pt{width:5px;height:5px;border-radius:50%;background:#1a1a1a;align-self:flex-end;margin:0 1px 6px}
.reg .u{font:600 13px Barlow,sans-serif;color:#6b6967;align-self:center;padding:0 4px 0 6px}
.reg.dash{padding:5px 14px;color:#a3a19f}
main{max-width:1320px;margin:0 auto;padding:4px max(4vw,16px) 56px}
.view.enter{animation:rise .3s ease-out both}
.sec{margin-top:34px}
h2{font-size:27px;line-height:1.05;margin:0;font-weight:700}
h3{font-size:20px;margin:0 0 8px;font-weight:700}
.lede{color:var(--mute);margin:4px 0 0;font-size:15px}
.sechead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;justify-content:space-between;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgb(0 0 0/.03)}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;color:var(--mute);font-size:13.5px;white-space:nowrap}
tbody tr:hover{background:var(--soft)}
tr.sel{background:var(--tint)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px;text-align:left}
.tb:hover{color:var(--red)}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:9px 18px;min-height:44px;font-weight:700}
.btn:hover{background:var(--ink);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--deep)}
.btn.sm{min-height:36px;padding:5px 14px;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
label.f select{font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;background:#fff;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;font-size:14.5px}
.tag::before{content:"";width:10px;height:10px;flex:none;border-radius:50%;background:var(--c,var(--ok))}
.tag.dq{--c:var(--red)}.tag.an::before{border-radius:1px;transform:rotate(45deg) scale(.85);background:var(--amber)}
.tag.ok{--c:var(--teal)}.tag.part::before{background:var(--amber)}.tag.miss{--c:var(--ink)}.tag.mute{--c:var(--ok);color:var(--mute)}
.chip{display:inline-block;font:600 12.5px/1 Barlow,sans-serif;padding:4px 8px;border-radius:99px;background:var(--soft);margin:2px 4px 2px 0;white-space:nowrap}
.chip.dq{background:var(--tint);color:var(--deep)}.chip.an{background:var(--ambersoft);color:var(--amberink)}
/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:20px}
.map{background:#eef3f6;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.map>svg{display:block;width:100%;height:auto}
.land{fill:#cdd6dc;stroke:#fff;stroke-width:.4}
.pin{cursor:pointer;outline:none}
.pin .hit{fill:transparent}
.pin .dot{fill:var(--c,#b9b7b5);stroke:#fff;stroke-width:1.6;transform-box:fill-box;transform-origin:center;transition:transform .2s}
.pin.dq{--c:var(--red)}.pin.an{--c:var(--amber)}.pin.q1{--c:#f8b9bc}.pin.q2{--c:#f45a61}.pin.q3{--c:#b8000a}
.tag.q1{--c:#f8b9bc}.tag.q2{--c:#f45a61}.tag.q3{--c:#b8000a}
.pin:hover .dot,.pin:focus-visible .dot{transform:scale(1.25)}
.pin .late{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:2 1.6}
.pin .pulse{fill:none;stroke:var(--red);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-out infinite}
.pin .ring{fill:none;stroke:var(--ink);stroke-width:1.6}
.pin:focus-visible .hit{stroke:var(--amber);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px 12px;font-size:14px;color:var(--mute)}
.side{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;animation:fade .25s ease-out}
.side .big{font:800 38px/1 "Barlow Condensed",sans-serif}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:15px}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
/* bars and sparks */
.hbar{display:grid;grid-template-columns:8.5em minmax(0,1fr) 5.5em;gap:10px;align-items:center;font-size:14.5px;margin:7px 0}
.hbar .tr{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--teal)}
.hbar .tr i.sup{background:#9bd3cb}.hbar .tr i.gap{background:repeating-linear-gradient(135deg,#d9d7d5 0 3px,#f3f2f1 3px 7px)}
svg.spark{width:120px;height:28px;display:block}
/* chart */
.fig{position:relative}
.chart{position:relative;height:320px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0/.12);padding:8px 10px;font-size:13.5px;min-width:180px;display:none;z-index:3}
.tip b{font:700 20px/1.1 "Barlow Condensed",sans-serif}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mute);margin-top:10px;align-items:center}
.key i{display:inline-block;vertical-align:-2px;margin-right:6px}
/* day panel */
.boardwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px}
.rowlab{display:grid;grid-template-rows:18px repeat(4,28px);gap:3px;font-size:12px;color:var(--mute);align-items:center}
.board{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}
.hr{display:grid;grid-template-rows:18px repeat(4,28px);gap:3px}
.hr>span{font-size:12px;color:var(--mute);text-align:center}
.c{border:0;border-radius:5px;padding:0;position:relative;background:var(--b,#eef2f1)}
.c:hover{outline:2px solid var(--ink);outline-offset:-2px}
.c.miss{background:repeating-linear-gradient(135deg,#dcdad8 0 3px,#f6f5f4 3px 7px)}
.c.nul{background:#fff;box-shadow:inset 0 0 0 1.5px #d6d4d2}
.c i{position:absolute;right:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 1.5px #fff}
.c i.an{border-radius:1px;transform:rotate(45deg);background:var(--amber);width:8px;height:8px}
.c[aria-pressed=true]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);z-index:2}
.rules{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.rules li{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:14.5px;padding:6px 10px;border-radius:8px;background:var(--soft)}
.rules li.fail{background:var(--tint)}.rules li.anf{background:var(--ambersoft)}.rules li.na{color:var(--mute);background:transparent;border:1px dashed var(--line)}
.rules li b{font-weight:700}.rules li em{font-style:normal;font-weight:700;white-space:nowrap}
.rules li.fail em{color:var(--deep)}.rules li.anf em{color:var(--amberink)}.rules li.pass em{color:var(--teal2)}
/* ingestion grid */
.igrid{display:grid;grid-template-columns:9em repeat(28,minmax(0,1fr));gap:2px;font-size:12.5px;align-items:center}
.igrid .h{color:var(--mute);text-align:center;font-size:11.5px}
.igrid .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ic{height:22px;border-radius:3px;background:#bfe6df}
.ic.part{background:var(--amber)}.ic.miss{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,#d9d7d5 2px 5px)}
/* digest */
.msgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(19em,1fr));gap:16px}
.msg{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.msg header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.msg header .av{width:30px;height:30px;font-size:13px;background:var(--red);color:#fff}
.msg .bd{padding:12px 14px;font-size:14.5px}
.msg .bd ul{margin:8px 0 0;padding-left:18px}
.data{display:grid;grid-template-columns:repeat(auto-fill,minmax(22em,1fr));gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;padding:3px;background:#fff}
.seg button{border:0;background:none;padding:7px 16px;border-radius:99px;font-weight:600;min-height:38px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.s-ok{background:#bfe6df}.s-an{background:var(--amber)}.s-dq{background:var(--red)}.s-part{background:repeating-linear-gradient(135deg,#8f8d8b 0 2px,#e4e2e0 2px 5px)}.s-miss{background:var(--ink)}
.sw{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.mx{display:grid;grid-template-columns:7.5em repeat(var(--n),minmax(11px,1fr)) 3em 2.6em 3em 3.8em;gap:2px;min-width:780px;align-items:center;font-size:13px}
.mx .h,.ym .h{color:var(--mute);text-align:center;font-size:11.5px}.mx .h.we{color:#b4b2b0}.mx .n,.ym .n{text-align:right;font-variant-numeric:tabular-nums;padding-left:4px}
.ph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.cell{height:20px;border:0;border-radius:3px;padding:0}.cell:hover{outline:2px solid var(--ink);outline-offset:-1px}.cell.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.ym{display:grid;grid-template-columns:7.5em repeat(12,minmax(36px,1fr)) 3.6em 4.6em;gap:4px 3px;min-width:640px;align-items:center;font-size:13px}
.ybar{display:flex;gap:1px;height:22px;border:0;padding:0;border-radius:4px;overflow:hidden;background:#fff}.ybar i{display:block;height:100%}.ybar:hover{outline:2px solid var(--ink);outline-offset:1px}
.comp{display:flex;gap:1px;height:14px;border-radius:4px;overflow:hidden}.comp i{display:block;height:100%}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14.5px;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--mute);font-size:13.5px;margin-top:40px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:900px){.cols,.mapgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.fig+.fig{border-left:0;padding-left:0}.figs{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}.reg{font-size:24px}
 .boardwrap{grid-template-columns:minmax(0,1fr)}.rowlab{display:none}.board{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}.hr{grid-template-rows:auto;grid-template-columns:2.4em repeat(4,minmax(0,1fr));gap:4px}.hr>span{text-align:left;align-self:center}.hr>.c{height:36px}
 table{font-size:14px}th,td{padding:8px 5px}.hide-s{display:none}.chart{height:260px}.igrid{grid-template-columns:5.5em repeat(28,minmax(0,1fr));gap:1px}.ic{height:16px}.rules li{grid-template-columns:minmax(0,1fr) auto}.rules li span{grid-column:1/-1;grid-row:2}}
</style></head>
<body>
<header class="band">
 <div class="fx" aria-hidden="true"><div class="bubbles" id="bubbles"></div></div>
 <div class="bar"><div class="brand"><svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#fff"/><path d="M15 15 L22 8" stroke="#f40009" stroke-width="3" stroke-linecap="round"/><circle cx="15" cy="15" r="2.6" fill="#f40009"/><path d="M6 19a10 10 0 0 1 18 0" fill="none" stroke="#f40009" stroke-width="1.6" stroke-dasharray="1.5 2.2"/></svg>EMS Alert System</div>
 <div class="me"><span class="av">DK</span><span><b>Doyeon K.</b><small>Energy data · APAC</small></span></div></div>
 <nav id="nav" aria-label="Workspace"></nav>
 <div class="fx" aria-hidden="true"><svg class="wave b" viewBox="0 0 2400 60" preserveAspectRatio="none"><path d="M0 30 C400 58 800 2 1200 30 C1600 58 2000 2 2400 30 V60 H0Z"/></svg><svg class="wave" viewBox="0 0 2400 60" preserveAspectRatio="none"><path d="M0 40 C300 18 900 62 1200 40 C1500 18 2100 62 2400 40 V60 H0Z"/></svg></div>
</header>
<section id="hero"></section>
<main id="main"></main>

function drawEnergy(a,b){

  groups.forEach((g,k)=>{const x0=ml+k*gw+(gw-ns*(bw+2))/2;g.v.forEach((v,j)=>{const h=v/mx*ih;s+=`<rect x="${x0+j*(bw+2)}" y="${mt+ih-h}" width="${bw}" height="${Math.max(0,h)}" rx="${Math.min(4,bw/2)}" fill="${cols[j]}"/>`});
   if(!(W<520&&!yr&&k%3))s+=`<text x="${ml+k*gw+gw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mute)">${g.label}</text>`;

function chart(m,d){
 const el=$('#chart'),tip=$('#tip');if(!el)return;

 for(const a of dqa)if(a.mi===ui.mi&&a.i>=a0&&a.i<a1){const t=rules[a.r].type;if(!flag.has(a.i)||t==='DQ')flag.set(a.i,{t,r:rules[a.r].id})}

  const W=el.clientWidth,H=el.clientHeight,ml=W<520?34:46,mr=10,mt=10,mb=30,iw=W-ml-mr,ih=H-mt-mb;

  let band='',up=[],dn=[];const flushB=()=>{if(up.length)band+=`<path d="M${up.join('L')}L${dn.reverse().join('L')}Z" fill="#e9e7e5"/>`;up=[];dn=[]};
  for(let i=a0;i<a1;i++){const b=bl[i-a0];if(b){up.push(`${X(i).toFixed(1)},${Y(b.med+Z*b.spread).toFixed(1)}`);dn.push(`${X(i).toFixed(1)},${Y(Math.max(0,b.med-Z*b.spread)).toFixed(1)}`)}else flushB()}flushB();
  let path='',pen=false;for(let i=a0;i<a1;i++){const v=val(i);if(v==null||m.st[i]===S.positive_spike_ignored){pen=false;continue}path+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);pen=true}
  const ticks=[0,.2,.4,.6,.8,1].map(f=>f*ymax);
  let s=`<rect x="${X(d*96)-iw/N/2}" y="${mt}" width="${iw*96/N}" height="${ih}" fill="var(--tint)"/>`;
  s+=ticks.map(t=>`<line x1="${ml}" x2="${W-mr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#efedeb"/><text x="${ml-6}" y="${Y(t)+4}" text-anchor="end" font-size="12" fill="var(--mute)">${fmt(t,t<10?1:0)}</text>`).join('');
  for(let dd=Math.max(0,d-6);dd<=d;dd++){const x=X(dd*96)-iw/N/2;s+=`<line x1="${x}" x2="${x}" y1="${mt}" y2="${mt+ih}" stroke="#e4e2e0"/>`+(W<520&&(d-dd)%2?'':`<text x="${x+iw*48/N}" y="${H-10}" text-anchor="middle" font-size="12" fill="${dd===d?'var(--ink)':'var(--mute)'}" font-weight="${dd===d?700:400}">${W<520?dlab(dd).split(' ')[0]:wd(dd)+' '+dlab(dd)}</text>`)}
  s+=band+`<path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round"/>`;
  let an='',dqs='',first=new Set();
  for(let i=a0;i<a1;i++){const f=flag.get(i),v=val(i);if(!f)continue;const prevF=flag.get(i-1),nextF=flag.get(i+1);
   if(f.t==='Anomaly'&&v!=null){if(nextF&&nextF.t==='Anomaly'&&val(i+1)!=null)an+=`M${X(i).toFixed(1)},${Y(v).toFixed(1)}L${X(i+1).toFixed(1)},${Y(val(i+1)).toFixed(1)}`;if(!prevF||prevF.t!=='Anomaly')first.add(i)}
   if(f.t==='DQ'){dqs+=`M${X(i).toFixed(1)},${mt+ih-9}V${mt+ih}`;if(!prevF||prevF.t!=='DQ')first.add(i)}}
  s+=`<path d="${an}" fill="none" stroke="var(--amber)" stroke-width="5" stroke-linecap="round" opacity=".9"/><path d="${dqs}" fill="none" stroke="var(--red)" stroke-width="2.5"/>`;
  for(const i of first){const f=flag.get(i),v=val(i);if(f.t==='DQ'){if(v!=null&&m.st[i]!==S.positive_spike_ignored)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="var(--red)" stroke="#fff" stroke-width="2"/>`}
   else s+=`<rect x="${X(i)-5}" y="${Y(v)-5}" width="10" height="10" transform="rotate(45 ${X(i)} ${Y(v)})" fill="var(--amber)" stroke="#fff" stroke-width="2"/>`}
  const sv=val(ui.i);s+=`<line x1="${X(ui.i)}" x2="${X(ui.i)}" y1="${mt}" y2="${mt+ih}" stroke="var(--ink)" stroke-dasharray="3 3"/>${sv!=null?`<circle cx="${X(ui.i)}" cy="${Y(sv)}" r="5" fill="none" stroke="var(--ink)" stroke-width="2"/>`:''}`;
  s+=`<line id="xh" x1="0" x2="0" y1="${mt}" y2="${mt+ih}" stroke="var(--mute)" visibility="hidden"/><rect id="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>`;
  el.innerHTML=`<svg role="img" aria-label="${m.device_name} readings for 7 days to ${dlab(d)}">${s}</svg>`;
  const hit=el.querySelector('#hit'),xh=el.querySelector('#xh');
  const at=ev=>{const r=el.getBoundingClientRect();return Math.max(a0,Math.min(a1-1,Math.round(a0+(ev.clientX-r.left-ml)/iw*N-.5)))};
  hit.onpointermove=ev=>{const i=at(ev),v=val(i),b=bl[i-a0],f=flag.get(i),r=el.getBoundingClientRect();xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.setAttribute('visibility','visible');
   tip.innerHTML=`<b>${v==null?'—':fmt(v,1)}</b> ${pw?'kW':m.engineering_unit}<br><span style="color:var(--mute)">${wd(Math.floor(i/96))} ${dlab(Math.floor(i/96))} ${hm(START+i*SLOT)} UTC</span>${b?`<br>usual ${fmt(b.med,1)} · band ${fmt(Math.max(0,b.med-Z*b.spread),1)}–${fmt(b.med+Z*b.spread,1)}`:''}${f?`<br><span class="tag ${f.t==='DQ'?'dq':'an'}">${f.r}</span>`:''}`;
   tip.style.display='block';const x=X(i);tip.style.left=Math.min(r.width-200,Math.max(0,x+12))+'px';tip.style.top='8px'};

/* ---------- Rulebook ---------- */
function rulebook(){

 <div class="figs">${fig('r-dq',8,'DQ rules · demo_v1',0,2)}${fig('r-an',1,'anomaly rule · baseline_v1',0,2)}${fig('r-rows',dqa.length,'dq_alert rows, 28 days',0,5)}${fig('r-al',alerts.length,'alerts after compression',0,4)}</div>`;
 const body=`<section class="sec"><div class="scroll"><table><thead><tr><th>Rule</th><th>What it checks</th><th class="n">This batch</th><th class="n hide-s">Alerts, 28 d</th><th class="n hide-s">dq_alert rows</th><th class="hide-s">Last triggered (UTC)</th><th class="n hide-s">Plants</th><th class="n hide-s">Tag-days, 12 m</th></tr></thead>

 {name:'contributions_weekly',src:'CSV',cols:['plant_id','tag_id','hierarchy_path','measurement_type','week_start_utc','energy_mj','gold_rows','rows_missing_factor','latest_event_utc','energy_mwh','building','supply_demand_scope','energy_type','energy_user','device_name','tag_name'],used:'Plant meters (MWh, Supply vs Demand), Network overview',rows:()=>weekly('c')},
 {name:'silver_coverage_weekly',src:'CSV',cols:['tag_id','hierarchy_path','week_start_utc','silver_rows','first_event_utc','last_event_utc','min_raw_value','max_raw_value','plant_id'],used:'Daily ingestion',rows:()=>weekly('s')},
 {name:'selected_tag_hourly',src:'CSV',cols:['plant_id','tag_id','week_start_utc','hour_start_utc','energy_mj','energy_mwh','gold_rows'],used:'Not drawn yet (hourly view)',rows:()=>{const m=meters[ui.mi],out=[];for(let h=0;h<24;h++){let mj=0,g=0;for(let q=0;q<4;q++){const i=ui.day*96+h*4+q;if(m.gold[i])g++;if(!Number.isNaN(m.delta[i])&&m.FactorToMJ!=null)mj+=m.delta[i]*m.FactorToMJ}out.push([m.plant_id,m.tag_id,weekStart(ui.day),isoT(START+ui.day*DAY+h*36e5),mj.toFixed(1),(mj/3600).toFixed(4),g])}return out},note:()=>`selected tag, ${dlab(ui.day)}`},
 {name:'meter_slot',src:'D1',cols:['plant','tag','slot','event_key','status','raw','delta','unit','factor','running','silver','gold','rest','overdue'],used:'Rule evaluation input (rest, overdue)',rows:()=>{const m=meters[ui.mi],out=[];for(let k=0;k<96;k++)out.push(Object.values(slotRow(m,ui.day*96+k)));return out},note:()=>`selected tag, ${dlab(ui.day)}`},
 {name:'daily_meter_summary',src:'Proposed',cols:['plant_id','tag_id','day_start_utc','expected_rows','silver_rows','gold_rows','rows_missing_factor','energy_mj','energy_mwh',...rules.map(r=>'alert_slots_'+r.id)],used:'Network overview (Month, 12 months), Plant meters, Daily ingestion',rows:()=>{const mo=months[ui.month],out=[];for(const m of meters)for(let yd=mo.s;yd<=mo.e;yd++)out.push([m.plant_id,m.tag_id,yiso(yd),96,m.ds.sil[yd],m.ds.gold[yd],m.ds.mnf[yd],m.FactorToMJ==null||m.measurement_type!=='running_total'?'':(m.ds.mwh[yd]*3600).toFixed(1),m.FactorToMJ==null||m.measurement_type!=='running_total'?'':m.ds.mwh[yd].toFixed(4),...rules.map((r,k)=>m.ds.al[yd*RN+k])]);return out},note:()=>`Gold aggregate, ${months[ui.month].label}`},
 {name:'dq_alert',src:'D1',cols:['plant','tag','slot','rule','version','triggered_at'],used:'Alert inbox, Rulebook, Daily notification (after compression)',rows:()=>dqa.map(a=>Object.values(dqaRow(a)))}];
const weekStart=d=>{const t=new Date(START+d*DAY),k=(t.getUTCDay()+6)%7;return new Date(START+(d-k)*DAY).toISOString().slice(0,10)};
function weekly(kind){const out=[];for(const m of meters){const wk=new Map();for(let i=0;i<NS;i++){const w=weekStart(Math.floor(i/96));if(!wk.has(w))wk.set(w,{mj:0,g:0,mf:0,last:null,s:0,f:null,l:null,mn:Infinity,mx:-Infinity});const x=wk.get(w);if(m.gold[i]){x.g++;x.last=i}if(!Number.isNaN(m.delta[i])&&m.measurement_type==='running_total'){if(m.FactorToMJ==null)x.mf++;else x.mj+=m.delta[i]*m.FactorToMJ}if(m.sil[i]){x.s++;x.f??=i;x.l=i;if(!Number.isNaN(m.raw[i])){x.mn=Math.min(x.mn,m.raw[i]);x.mx=Math.max(x.mx,m.raw[i])}}}
 for(const [w,x] of wk)out.push(kind==='c'?[m.plant_id,m.tag_id,m.hierarchy_path,m.measurement_type,w,m.FactorToMJ==null?'':x.mj.toFixed(1),x.g,x.mf,x.last==null?'':isoT(START+x.last*SLOT),m.FactorToMJ==null?'':(x.mj/3600).toFixed(4),m.building,m.supply_demand_scope,m.energy_type,m.energy_user,m.device_name,m.tag_name]:[m.tag_id,m.hierarchy_path,w,x.s,x.f==null?'':isoT(START+x.f*SLOT),x.l==null?'':isoT(START+x.l*SLOT),x.mn===Infinity?'':x.mn,x.mx===-Infinity?'':x.mx,m.plant_id])}return out}
const csv=(cols,rows)=>[cols,...rows].map(r=>r.map(v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)||/^\d{4,}$/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
function dataView(){
 const hero=`<h1>Every value comes from these ${TABLES.length} tables</h1><p class="sub">Five CSVs and two D1 tables from your schema, plus one proposed daily aggregate built from them. Values are generated, columns are not. Everything else on screen is a calculation over these columns.</p>
 <div class="figs">${fig('d-t',TABLES.length,'tables',0,1)}${fig('d-c',TABLES.reduce((s,t)=>s+t.cols.length,0),'columns',0,2)}${fig('d-m',meters.length,'tags in meter_catalog',0,3)}${fig('d-r',dqa.length,'dq_alert rows',0,5)}</div>`;
 const body=`<section class="sec data">${TABLES.map((t,k)=>`<div class="card"><div class="sechead"><div><h3 style="margin:0">${t.name}</h3><p class="lede">${t.src==='D1'?'D1 table':t.src==='Proposed'?'<b style="color:var(--deep)">Proposed</b>':'CSV'} · ${t.cols.length} columns${t.note?' · '+t.note():''}</p></div><button class="btn sm" data-copy="${k}">Copy CSV</button></div><div>${t.cols.map(c=>`<span class="chip">${c}</span>`).join('')}</div><p class="lede" style="margin-top:10px">Used in: ${t.used}</p></div>`).join('')}</section>
 <section class="sec card"><h2>Calculated on screen, not stored</h2><ul style="margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.7"><li><b>Alerts</b>: dq_alert rows grouped by plant, tag, rule, version and UTC day, joining neighbouring slots.</li><li><b>Alert state</b>: New if the same meter and rule did not fire in the previous batch, otherwise Ongoing.</li><li><b>Batch status</b>: readings present per plant and UTC day out of ${TPL.length} × 96.</li><li><b>Baseline</b>: median and spread of published_value for the same weekday and slot, 1–3 weeks earlier.</li><li><b>MWh</b>: Σ published_value × FactorToMJ ÷ 3600, running_total only.</li><li><b>daily_meter_summary</b> (proposed): Silver and Gold grouped by plant_id, tag_id and UTC day, joined with dq_alert counts per rule. Built in the same daily batch and re-run when a day is reloaded. expected_rows comes from the 15-minute cadence; every other column is a count or sum of existing columns.</li></ul>
 <p class="lede" style="margin-top:12px">One input is outside your schema: plant city and map coordinates. City is also the first part of hierarchy_path; coordinates are a small reference list for the map.</p></section>`;
 return {hero,body};
}

/* ---------- render ---------- */
function roll(){for(const d of document.querySelectorAll('.reg .d[data-v]'))if(d.style.getPropertyValue('--v')!==d.dataset.v)requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.setProperty('--v',d.dataset.v)))}
function render(){
 nav();const enter=ui.lastView!==ui.view;ui.anim=enter&&!reduce;
 const v=({overview,plant:plantView,meter:meterView,rules:rulebook,alerts:alertsView,digest,ingest:ingestView,data:dataView}[ui.view]||overview)();ui.anim=false;
 const hero=$('#hero');hero.innerHTML=v.hero;if(enter){hero.classList.remove('enter');void hero.offsetWidth;hero.classList.add('enter')}
 $('#main').innerHTML=`<div class="view ${enter?'enter':''}">${v.body}<p class="foot">Generated sample values for 20 plants × ${TPL.length} tags using only the columns in your schema: a daily summary from 1 Nov 2025 and 15-minute detail for 1–${dlab(L)} 2026 UTC. Clock: ${dlab(L+1)} ${hm(NOW)} UTC.</p></div>`;
 ui.lastView=ui.view;roll();if(v.after)v.after();
}
function route(){const h=location.hash.slice(1);ui.view=views.some(v=>v[0]===h)?h:'overview';render();scrollTo({top:0,behavior:reduce?'auto':'smooth'})}
addEventListener('hashchange',route);
let rz,lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const b=w=>w<600?0:w<900?1:2;if(b(innerWidth)!==b(lastW)){lastW=innerWidth;if(ui.view==='overview')render()}},200)});
const go=(view)=>{if(ui.view===view)render();else location.hash=view};
document.addEventListener('click',e=>{if(!e.target.closest('#main,#hero'))return;
 const pin=e.target.closest('[data-plant]');if(pin){ui.plant=pin.dataset.plant;render();return}
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.goplant){ui.plant=t.dataset.goplant;go('plant');return}
 if(t.dataset.period){ui.period=t.dataset.period;ui.pd=null;render();return}
 if(t.dataset.pd){const [p,yd]=t.dataset.pd.split('|');ui.plant=p;ui.pd={p,yd:+yd};render();return}
 if(t.dataset.ym){const [p,k]=t.dataset.ym.split('|');ui.plant=p;ui.period='month';ui.month=+k;ui.pd=null;render();return}
 if(t.dataset.gometer){const [p,yd]=t.dataset.gometer.split('|'),pl=plantOf(p),d=+yd-OFF;let best=pl.meters.find(m=>m.code==='AC1'),bn=-1;for(const m of pl.meters){let n=0;for(let k=0;k<RN;k++)if(rules[k].id!=='FACTOR')n+=m.ds.al[+yd*RN+k];if(n>bn){bn=n;best=m}}ui.plant=p;ui.mi=meters.indexOf(best);ui.day=d;ui.i=firstSlot(ui.mi,d);go('meter');return}
 if(t.dataset.mi){ui.mi=+t.dataset.mi;ui.day=L;ui.i=firstSlot(ui.mi,L);go('meter');return}
 if(t.dataset.i){ui.i=+t.dataset.i;ui.day=Math.floor(ui.i/96);render();document.querySelector(`.c[data-i="${ui.i}"]`)?.focus({preventScroll:true});return}
 if(t.dataset.alert){const a=alerts[+t.dataset.alert];ui.mi=a.mi;ui.plant=a.m.plant_id;ui.day=a.rule.id==='FACTOR'?L:a.day;ui.i=a.rule.id==='FACTOR'?L*96+40:a.s;go('meter');return}
 if(t.dataset.rule){ui.af={range:'latest',type:'All',state:'All',rule:t.dataset.rule};go('alerts');return}
 if(t.id==='clr'){delete ui.af.rule;render();return}
 if(t.dataset.copy){const tb=TABLES[+t.dataset.copy],text=csv(tb.cols,tb.rows());navigator.clipboard?.writeText(text).then(()=>toast(`${tb.name}: ${text.split('\n').length-1} rows copied`),()=>toast('Copy was blocked by the browser'));return}
});
document.addEventListener('change',e=>{if(!e.target.closest('#main,#hero'))return;const id=e.target.id,v=e.target.value;
 if(id==='pp'){ui.plant=v;render()}
 if(id==='pm'){ui.month=+v;ui.pd=null;render()}
 if(id==='im'){ui.month=+v;render()}
 if(id==='mp'){const p=plantOf(v);ui.plant=v;const same=p.meters.find(m=>m.code===meters[ui.mi].code);ui.mi=meters.indexOf(same);render()}
 if(id==='mm'){ui.mi=+v;ui.i=firstSlot(ui.mi,ui.day);render()}
 if(id==='md'){ui.day=+v;ui.i=firstSlot(ui.mi,ui.day);render()}
 if(id==='fr'||id==='ft'||id==='fs'){ui.af[{fr:'range',ft:'type',fs:'state'}[id]]=v;render()}
 if(id==='dd'){ui.dday=+v;render()}
});
const hov=e=>{const c=e.target.closest('.c');if(c&&$('#readout'))$('#readout').innerHTML=readout(meters[ui.mi],+c.dataset.i)};
$('#main').addEventListener('mouseover',hov);$('#main').addEventListener('focusin',hov);
$('#main').addEventListener('keydown',e=>{
 const pin=e.target.closest('.pin');if(pin&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ui.plant=pin.dataset.plant;render();document.querySelector(`.pin[data-plant="${ui.plant}"]`)?.focus();return}
 const c=e.target.closest('.c');if(!c)return;const step={ArrowRight:4,ArrowLeft:-4,ArrowDown:1,ArrowUp:-1}[e.key];if(!step)return;
 e.preventDefault();const d=ui.day*96,n=Math.min(d+95,Math.max(d,+c.dataset.i+step));document.querySelector(`.c[data-i="${n}"]`)?.focus();
});
route();
}
</script>
</body></html>
